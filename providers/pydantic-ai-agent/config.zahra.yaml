# Zahra's Tongues — a two-agent stall, and half of the deliberate
# name collision (see config.yusuf.yaml). Part of the `demo` profile in
# docker-compose.yml.
souk_http_url: http://souk:8000
provider_name: Zahra's Tongues

agents:
  - name: translator
    description: >
      Plain, quick translation between any two languages. No flourishes,
      no interpretation — Zahra says what the words say.
    model: custom-openai
    skills:
      - name: translate
        description: Translate text between any language pair, plainly and quickly.
        tags: [language, translation, everyday, plain]
    # Keep Your Own Key (docs/keep-your-own-key.md): when a caller runs
    # its own bridge and offers to pay, this agent routes that run's LLM
    # calls through souk's /kyok/v1 relay instead of `model` above. A
    # caller without a bridge is unaffected — Zahra pays, as always.
    #
    # On this agent because it is the one where the story is obvious: a
    # visitor with their own key wanting a page translated should be able
    # to pay for their own page. It is also what makes KYOK live in the
    # demo market rather than only in the tests.
    use_kyok: true
    system_prompt: >
      You translate. The visitor gives you text; you give back the same
      text in the language they asked for, and nothing else — no notes on
      the grammar, no alternatives, no commentary on how beautiful the
      original was. If they did not say which language they want, ask,
      in one line. If the text is already in that language, say so
      instead of translating it into itself.

  - name: haggler
    description: >
      Argues a price down on your behalf. Tell Zahra what you want and
      what you are willing to pay, and she will tell you what to say.
    model: custom-openai
    skills:
      - name: negotiate
        description: Draft what to say to get a better price, and how far to push.
        tags: [negotiation, bargaining, commerce, prices]
    # A haggle is a conversation — the budget given on the first turn has
    # to still be known on the third. `SoukClient` sends the new message
    # only, so without this the haggler asks for the budget again every
    # time and never gets far enough to delegate.
    thread_history_limit: 20
    system_prompt: >
      You are a haggler in a marketplace, and a good one: you never
      insult the seller, because tomorrow you buy from them again.

      The visitor tells you what they want and what they hope to pay.
      Give them, briefly: an opening line to say, the price to open at,
      the price to settle at, and the point where they should walk away.
      Say the lines they should speak, not a lecture on negotiation.

      If they have not told you a budget, ask for one before advising —
      a haggler who does not know the ceiling is guessing.

      When the visitor wants the offer put in writing rather than spoken
      — a formal offer, a letter to a merchant who is not here — use
      call_scribe. That is Yusuf's stall across the way; you decide the
      terms, he writes them properly. Say that you sent the wording to
      the scribe, so the visitor knows whose hand it is in.
    # Cross-stall delegation: `scribe` lives under a different provider
    # identity entirely (config.yusuf.yaml), so this exercises the A2A
    # hop between two stalls rather than within one — the thing a market
    # shows that a list of agents cannot.
    #
    # A name and nothing else, because the address cannot be written
    # here: it contains Yusuf's key fingerprint, which does not exist
    # until his container has started once. It is resolved from the
    # roster on first delegation (see pydantic_ai_agent/resolve.py) —
    # which works precisely because `scribe` is unique in this market.
    # The two `translator`s deliberately are not, which is why neither is
    # a delegation target: pointing at one would get the refusal, naming
    # both stalls, rather than a guess.
    sub_agents:
      - name: scribe
