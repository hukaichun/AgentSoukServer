[project]
name = "souk-server"
version = "0.1.0"
description = "The reference souk gateway: AG-UI + A2A over HTTP, and the WebSocket relays providers and KYOK bridges connect out to"
requires-python = ">=3.12"
# AGPL-3.0, and for a gateway that is the choice with teeth. Every other
# strong copyleft licence is satisfied by never shipping a binary, which
# is exactly what running a server is — §13 is the clause that closes it:
# someone who modifies this and lets people talk to it over a network owes
# them the modified source, whether or not they ever distribute a copy.
#
# souk core is Apache-2.0 upstream and stays that way. Apache-2.0 is
# one-way compatible with (A)GPLv3, so an AGPL work may include it; the
# reverse is not true, which is why the licence lives on this side of the
# boundary and not upstream.
#
# The SDKs, the template and the reference providers in this repo are
# Apache-2.0 instead, each with its own LICENSE: a library a third party
# imports into their own agent is not a server, and AGPL there would
# oblige every provider author to publish their agent. See LICENSING.md.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# Not for an index. This package depends on souk core by bare name,
# resolvable only through the [tool.uv.sources] path below (the AgentSouk
# submodule) — uploaded anywhere, that name would resolve to whatever a
# stranger has published under it. PyPI refuses an unrecognised classifier, which is what
# makes this line a guard rather than a comment. Remove it when souk is
# genuinely published and this can name a real version.
classifiers = ["Private :: Do Not Upload"]
# This is where every I/O decision lives — which framework, which port,
# which TLS story — and why it is a separate distribution rather than an
# extra of `souk`: core cannot grow a uvicorn import without someone
# noticing they are in the wrong package.
dependencies = [
    "souk",
    # Upstream states the provider contract itself now — identity, the
    # port, and the provider's own loop, with no transport in it. This
    # gateway builds the socket around exactly that contract.
    "souk-provider-sdk",
    # Same relationship for the KYOK side: upstream states what an LLM
    # provider is (`ConnectedLLMProvider`, `DeliveredCompletion`, the
    # llm-registration payload), and /ws/kyok is the socket around it.
    "souk-llm-provider-sdk",
    "fastapi>=0.115",
    # [standard] brings websockets, which serves /ws/provider and /ws/kyok
    # — the ws relays need no dependency of their own.
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "mcp>=2.0",
]

[project.optional-dependencies]
# Passed through to souk itself — a gateway wanting the Postgres backend
# installs `souk-server[postgres]` rather than reaching past this package.
postgres = ["souk[postgres]"]

[project.scripts]
souk-server = "souk_server.server:main"

# souk core comes from the AgentSouk submodule, not a published dependency
# yet. Clone with --recurse-submodules or `uv sync` has nothing to resolve.
[tool.uv.sources]
souk = { path = "AgentSouk/souk", editable = true }
souk-provider-sdk = { path = "AgentSouk/souk-provider-sdk", editable = true }
souk-llm-provider-sdk = { path = "AgentSouk/souk-llm-provider-sdk", editable = true }
# Dev only, and only for one test. Every KYOK test in this repo writes the
# signing payload out by hand — deliberately, so a change to core's is
# caught by a disagreement rather than propagated by a shared helper — but
# that independence also means none of them would go red if
# `KyokSigningAuth`, the object a real provider attaches to its OpenAI
# client, drifted from core. One test using the shipped signer against the
# real app closes that, and this is what it costs.
souk-agent-sdk = { path = "souk-agent-sdk", editable = true }

# httpx drives the ASGI app in tests without binding a port; httpx-ws does
# the same for the two WebSocket relays.
[dependency-groups]
dev = [
    "souk-agent-sdk",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "httpx-ws>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Only this repo's suite — without this, pytest at the repo root recurses
# into the AgentSouk submodule and collects every subproject's tests.
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["souk_server"]
