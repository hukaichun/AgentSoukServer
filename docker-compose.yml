services:
  paradedb:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: souk
      POSTGRES_PASSWORD: souk
      POSTGRES_DB: souk
    ports:
      - "5433:5432"
    volumes:
      - paradedb_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U souk -d souk"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: applies souk's alembic/ (DDL) against paradedb, then exits.
  # Split out from the `souk` service below on purpose — souk itself never
  # runs DDL at startup (see souk_server/server.py), so a real deployment
  # runs this step separately with DDL-capable credentials and gives the
  # running server a DML-only role instead. Local dev reuses the same
  # `souk` Postgres user for both here, for simplicity only.
  #
  # working_dir is souk core inside the AgentSouk submodule (the library
  # owns its tables, so alembic runs from there, not from souk_server);
  # `uv run` there syncs souk's own environment at container start —
  # network-dependent, inherited from the upstream compose unchanged.
  souk-migrate:
    # Same image tag as `souk` below (which shares this same build config)
    # so Compose builds it once, not twice, under two different names.
    image: agentsouk-server
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/AgentSouk/souk
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      paradedb:
        condition: service_healthy
    environment:
      SOUK_DATABASE_URL: postgresql+psycopg://souk:souk@paradedb:5432/souk
      # Passes a host-exported SOUK_DB_SCHEMA through into the container —
      # Compose does NOT forward arbitrary host env vars on its own, only
      # ones a service's `environment:` explicitly references like this.
      # Defaults to `public` (souk.db_schema's own default) if unset.
      SOUK_DB_SCHEMA: ${SOUK_DB_SCHEMA:-public}

  souk:
    image: agentsouk-server
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "50051:50051"
    depends_on:
      souk-migrate:
        condition: service_completed_successfully
    environment:
      SOUK_DATABASE_URL: postgresql+psycopg://souk:souk@paradedb:5432/souk
      SOUK_PUBLIC_HTTP_URL: http://localhost:8000
      # No default in souk.config for this one — a predictable JWT signing
      # key is a real auth bypass. This value is only fine because it's
      # this repo's own local-dev stack; a real deployment must set its
      # own via SOUK_TOKEN_SIGNING_SECRET.
      SOUK_TOKEN_SIGNING_SECRET: dev-insecure-change-me
      # Must match souk-migrate's above — see that service's comment.
      SOUK_DB_SCHEMA: ${SOUK_DB_SCHEMA:-public}

volumes:
  paradedb_data:
