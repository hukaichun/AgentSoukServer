services:
  paradedb:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: souk
      POSTGRES_PASSWORD: souk
      POSTGRES_DB: souk
    ports:
      - "5433:5432"
    volumes:
      - paradedb_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U souk -d souk"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: applies souk's alembic/ (DDL) against paradedb, then exits.
  # Split out from the `souk` service below on purpose — souk itself never
  # runs DDL at startup (see souk_server/server.py), so a real deployment
  # runs this step separately with DDL-capable credentials and gives the
  # running server a DML-only role instead. Local dev reuses the same
  # `souk` Postgres user for both here, for simplicity only.
  #
  # Runs from /app against souk's alembic.ini by path — the schema still
  # belongs to core, but this uses the environment the image already
  # built. Pointing working_dir at /app/AgentSouk/souk instead (which the
  # upstream compose did, since the library owns its tables) makes `uv
  # run` sync a *second*, unbuilt environment at container start: it
  # needs the network every time the stack comes up, and it failed here
  # on a PyPI timeout with the image sitting right there, fully built.
  souk-migrate:
    # Same image tag as `souk` below (which shares this same build config)
    # so Compose builds it once, not twice, under two different names.
    image: agentsouk-server
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["uv", "run", "alembic", "-c", "AgentSouk/souk/alembic.ini", "upgrade", "head"]
    depends_on:
      paradedb:
        condition: service_healthy
    environment:
      SOUK_DATABASE_URL: postgresql+psycopg://souk:souk@paradedb:5432/souk
      # Passes a host-exported SOUK_DB_SCHEMA through into the container —
      # Compose does NOT forward arbitrary host env vars on its own, only
      # ones a service's `environment:` explicitly references like this.
      # Defaults to `public` (souk.db_schema's own default) if unset.
      SOUK_DB_SCHEMA: ${SOUK_DB_SCHEMA:-public}

  souk:
    image: agentsouk-server
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      souk-migrate:
        condition: service_completed_successfully
    environment:
      SOUK_DATABASE_URL: postgresql+psycopg://souk:souk@paradedb:5432/souk
      SOUK_PUBLIC_HTTP_URL: http://localhost:8000
      # No default in souk.config for this one — a predictable JWT signing
      # key is a real auth bypass. This value is only fine because it's
      # this repo's own local-dev stack; a real deployment must set its
      # own via SOUK_TOKEN_SIGNING_SECRET.
      SOUK_TOKEN_SIGNING_SECRET: dev-insecure-change-me
      # Must match souk-migrate's above — see that service's comment.
      SOUK_DB_SCHEMA: ${SOUK_DB_SCHEMA:-public}

  # The stall at the gate: the guide that knows who else is here. An
  # ordinary provider — own key, own row in the roster, work claimed over
  # WS /ws/provider — that reaches the market through the gateway's own
  # MCP surface (/mcp) rather than GET /agents, which is what makes it
  # the first real consumer of that surface rather than a special case.
  #
  # Needs an LLM: copy .env.example to .env and fill in LLM_BASE_URL /
  # LLM_API_KEY / LLM_MODEL_NAME (or ANTHROPIC_API_KEY and change the
  # config's `model:`). Compose reads .env from this directory for the
  # ${...} below.
  docent:
    build:
      context: .
      dockerfile: providers/pydantic-ai-agent/Dockerfile
    depends_on:
      - souk
    volumes:
      - ./providers/pydantic-ai-agent/config.docent.yaml:/app/config.yaml:ro
      # Without this the docent mints a fresh Ed25519 identity on every
      # recreate, and the previous one's agent_id is left in the roster as
      # an orphan — two "docent" entries, one of them permanently offline.
      # Persisting the key is what makes `docker compose up --build`
      # idempotent (souk keys ownership on the public key, not the name).
      - docent_identity:/data
    environment:
      SOUK_IDENTITY_KEY_PATH: /data/souk_identity.key
      LLM_BASE_URL: "${LLM_BASE_URL}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME}"
      LLM_API_KEY: "${LLM_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

  # A second stall, behind `--profile demo`: souk-guide delegating to
  # summarizer delegating to translator, so there is a real multi-hop A2A
  # chain to watch (GET /threads/{id}/tree). Off by default because it
  # spends LLM tokens on every run and the gateway does not need it.
  #
  #   docker compose --profile demo up --build
  #
  # Its config names its sub-agents and nothing else. The A2A URL cannot
  # be written there: it contains this provider's own key fingerprint,
  # which does not exist until the provider has started once — so the name
  # is resolved against the roster on first delegation (see
  # pydantic_ai_agent/resolve.py). Lazily, because a sub-agent is often a
  # sibling container that has not registered yet at boot, and a
  # delegation edge must not become a boot order.
  guide:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: providers/pydantic-ai-agent/Dockerfile
    depends_on:
      - souk
    volumes:
      - ./providers/pydantic-ai-agent/config.example.yaml:/app/config.yaml:ro
      - guide_identity:/data
    environment:
      SOUK_IDENTITY_KEY_PATH: /data/souk_identity.key
      LLM_BASE_URL: "${LLM_BASE_URL}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME}"
      LLM_API_KEY: "${LLM_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

volumes:
  paradedb_data:
  docent_identity:
  guide_identity:
